{% set version = "3.0.15" %}

package:
  name: preshed
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/preshed/preshed-{{ version }}.tar.gz
  sha256: 47c6ccd9e2b5639f5983a1645bb270e8812964c03f23e989ee7996c64691fdc8

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
  host:
    - cymem >=2.0.2,<2.1.0
    - murmurhash >=0.28.0,<1.1.0
    - cython
    - pip
    - python
    - setuptools
    - wheel

  run:
    - python
    - cymem >=2.0.2,<2.1.0
    - murmurhash >=0.28.0,<1.1.0

test:
  requires:
    - pytest
  imports:
    - preshed
  commands:
    - python -m pytest --tb=native --pyargs preshed

about:
  home: https://github.com/explosion/preshed
  license: MIT
  license_file: LICENSE
  summary: Cython Hash Table for Pre-Hashed Keys
  description: |
    Simple but high performance Cython hash table mapping pre-randomized keys
    to void* values.

extra:
  recipe-maintainers:
    - rmax
    - h-vetinari
    - conda-forge/spacy
